name: Landing

# Same shape and the same path filter as console.yml. It is the app a stranger
# sees first, so it gets a gate for the same reason the console does.
on:
  push:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
  pull_request:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"

jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      # npm 11, pinned. `npm ci` does not check the lockfile for internal
      # consistency -- it rebuilds the tree with the RUNNING npm's resolver and
      # demands the lockfile already contain every package that resolver picked.
      # npm 10 and npm 11 disagree about optional peer dependencies, so node
      # 22's bundled npm 10 rejects a lockfile npm 11 wrote and npm 11 accepts.
      # Measured, not guessed: the first run of this workflow failed on
      # `Missing: ajv@8.20.0 from lock file` (console) and `Missing:
      # lru-cache@11.5.2` (landing, an optional peer of nitro's unstorage),
      # both from a clean `npm ci` that passes locally on npm 11.
      - name: Pin npm to the major that maintains these lockfiles
        run: npm i -g npm@11

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      # No test step: apps/landing has no `test` script. Checked, not assumed.

      - name: Build
        run: npm run build
        env:
          # The one VITE_ var this app reads. The Launch CTA is a plain
          # cross-origin link built from it, so an undefined value would ship a
          # link to the literal string "undefined".
          VITE_CONSOLE_URL: https://example.invalid
