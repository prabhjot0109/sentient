[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentient"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cachetools>=6.2.4",
    "faiss-cpu",
    "fastapi>=0.128.0",
    "fastembed>=0.8.0",
    "langchain<1.0.0",
    "langchain-community",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-huggingface",
    "langchain-openai",
    "langchain-qdrant>=0.2.1",
    "langchain-text-splitters",
    "pillow",
    "pyjwt[crypto]>=2.11.0",
    "pymupdf",
    "pypdf",
    "pytesseract",
    "python-dotenv",
    "python-multipart>=0.0.21",
    "sentence-transformers>=5.2.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentient"]
