[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentient"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cachetools>=6.2.4",
    "faiss-cpu",
    "fastapi>=0.128.0",
    "fastembed>=0.8.0",
    "langchain<1.0.0",
    "langchain-community",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-huggingface",
    "langchain-openai",
    "langchain-qdrant>=0.2.1",
    "langchain-text-splitters",
    "pillow",
    "pyjwt[crypto]>=2.11.0",
    "pymupdf",
    "pypdf",
    "pytesseract",
    "python-dotenv",
    "python-multipart>=0.0.21",
    "sentence-transformers>=5.2.0",
    "uvicorn>=0.40.0",
]

[project.scripts]
sentient = "sentient.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentient"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    # FastAPI *requires* calls in argument defaults: Depends(), File(), Form(),
    # Header() are sentinels the framework reads out of __defaults__ to build the
    # OpenAPI schema and pick a body parser. B008 is right about Python and wrong
    # about FastAPI, so it is off for the whole project rather than noqa'd per route.
    "B008",
]
